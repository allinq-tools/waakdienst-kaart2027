<style>
:root{--bg:#f4f6f8;--panel:#fff;--fg:#17212b;--muted:#5b6b7a;--line:#d9e0e7;--accent:#2e8b57;--err:#c2462f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10161c;--panel:#18212a;--fg:#e6edf3;--muted:#93a3b2;--line:#2a3642;--accent:#5cc08a;--err:#ec7a63;color-scheme:dark}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0}
body.locked{background:var(--bg);color:var(--fg);font:15px/1.5 "Barlow",system-ui,sans-serif;display:grid;place-items:center;padding-inline:16px;min-height:100%}
.card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 24px;display:grid;gap:14px}
.eyebrow{font:500 12px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 30px/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0}
p{margin:0;color:var(--muted)}
label{font:500 12px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input{width:100%;font:500 26px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.4em;text-align:center;padding:10px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
button{font:600 16px "Barlow",system-ui,sans-serif;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.5em;font-size:14px;color:var(--err)}
</style>
</head>

async function unlock(pin){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(P.i)},key,u(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){
  const doc=new DOMParser().parseFromString(html,"text/html");
  document.title=doc.title||document.title;
  document.head.querySelectorAll("style,link[rel=stylesheet]").forEach(n=>n.remove());
  doc.head.querySelectorAll("style,link[rel=stylesheet]").forEach(n=>document.head.appendChild(document.importNode(n,true)));
  const scripts=[...doc.body.querySelectorAll("script")].map(sc=>{const t=sc.textContent, src=sc.getAttribute("src"); sc.remove(); return {t,src};});
  document.body.removeAttribute("style");
  document.body.replaceChildren(...[...doc.body.childNodes].map(n=>document.importNode(n,true)));
  document.body.className=doc.body.className;
  for(const {t,src} of scripts){ const s=document.createElement("script"); if(src) s.src=src; else s.textContent=t; document.body.appendChild(s); }
  window.scrollTo(0,0);
}

    let html;
    try{ html=await unlock(pin); }
    catch(err){ throw {wrong:true}; }
    show(html);
  }catch(err){
    if(!err||!err.wrong){ btn.disabled=false; btn.textContent="Openen"; msg.textContent="De code is juist, maar de pagina kon niet worden getoond ("+(err&&err.message||err)+"). Open het bestand in Chrome, Edge, Firefox of Safari."; return; }
    btn.disabled=false; btn.textContent="Openen";
    msg.textContent="Onjuiste pincode. Probeer het opnieuw.";
    const i=document.getElementById("pin"); i.value=""; i.focus();
  }
});
})();
</script>
</body>
</html>
